# Template for test 1
tables:
  - p: cpu
    name: "cpu"
    body:
      cpu.core: $head$
      cpu.usage: $value$
  - path: ram//devices
    name: "ram"
    body:
      ram.name: name
      ram.total: total
      ram.user: used
  - path: disks
    name: "disks"
    body:
      disk.name: mount
      disk.total: size
      disk.user: used
