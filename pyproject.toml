[build-system]
requires = ["setuptools >= 77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csv4j"
version = "0.13.0"
description = "Lightweight CLI utility to extract tables from JSON and emit CSV representations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["csv", "json", "cli", "data-extraction", "yaml"]
authors = [
  { name = "noobun", email = "noobun.dev@gmail.com" },
]
maintainers = [
  { name = "noobun", email = "noobun.dev@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

# Runtime dependencies (minimal)
dependencies = [
    "PyYAML >= 6.0",
]

[project.optional-dependencies]
# Development and testing dependencies
dev = [
    "black >= 24.1.0",
    "ruff >= 0.3.0",
    "flake8 >= 6.1.0",
    "bandit >= 1.8.0",
    "mypy >= 1.7.0",
    "jsonschema >= 4.0",
]
test = [
    "pytest >= 7.4.0",
    "pytest-cov >= 4.1.0",
]
# All optional dependencies combined
all = [
    "csv4j[dev]",
    "csv4j[test]",
]

[project.urls]
Homepage = "https://github.com/noobun/csv4j/"
Documentation = "https://github.com/noobun/csv4j/wiki"
Repository = "https://github.com/noobun/csv4j.git"
Issues = "https://github.com/noobun/csv4j/issues"
Changelog = "https://github.com/noobun/csv4j/releases"

[tool.setuptools]
packages = ["csv4j"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313"]
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = ["E501"]  # Line too long

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
