[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "csv4j"
version = "0.11.0"
authors = [
  { name="noobun", email="noobun.dev@gmail.com" },
]
description = "Lightweight CLI utility to extract tables from JSON and emit CSV representations."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/noobun/csv4j"
Issues = "https://github.com/noobun/csv4j/issues"
